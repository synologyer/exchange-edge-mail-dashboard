<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Exchange Edge 邮件监控台</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f63e9'/%3E%3Cpath d='M13 19h38v27H13z' fill='white'/%3E%3Cpath d='m14 21 18 15 18-15' fill='none' stroke='%231f63e9' stroke-width='5'/%3E%3C/svg%3E">
  <style>
    :root{--blue:#1f63e9;--green:#14965a;--red:#df3c36;--orange:#f27618;--ink:#142033;--muted:#6d7d94;--line:#e6ebf3;--bg:#f4f7fb;--card:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
    button,select,input{font:inherit}.shell{max-width:1560px;margin:auto;padding:28px}.top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}
    h1{margin:0;font-size:30px;letter-spacing:-.5px}.sub{color:var(--muted);margin-top:4px}.actions{display:flex;gap:10px;align-items:center}
    select,button,input{height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 14px}button{cursor:pointer;font-weight:650}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
    .cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 7px 28px rgba(24,43,78,.05)}
    .metric{padding:18px 20px}.metric label{display:block;color:var(--muted);font-weight:650}.metric strong{font-size:34px;line-height:1.2}.blue{color:var(--blue)}.green{color:var(--green)}.red{color:var(--red)}.orange{color:var(--orange)}
    .panel{margin-top:14px;padding:18px}.panel-title{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:14px}.panel-title h2{font-size:17px;margin:0}.legend{display:flex;gap:15px;color:var(--muted);font-size:13px}.dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}
    #chart{width:100%;height:210px;display:block}.bar-label{font-size:11px;fill:#728198}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.search{min-width:250px;flex:1}.meta{color:var(--muted);font-size:13px}
    .tabs{display:flex;gap:5px;overflow:auto;border-bottom:1px solid var(--line);margin:0 -18px;padding:0 18px}.tab{height:43px;border:0;border-radius:0;background:transparent;padding:0 13px;color:#5b6b82;white-space:nowrap}.tab.active{color:var(--blue);border-bottom:3px solid var(--blue)}
    .table-wrap{overflow:auto;max-height:480px;margin:0 -18px -18px}.table{width:100%;border-collapse:collapse;min-width:1250px}.table th{position:sticky;top:0;background:#f7f9fc;color:#596a81;text-align:left;font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line)}.table td{padding:9px 12px;border-bottom:1px solid #edf1f6;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.table tr:hover td{background:#f8fbff}
    .pill{font-size:12px;padding:3px 8px;border-radius:999px;background:#edf3ff;color:#245fca}.pill.danger{background:#fff0ef;color:#c72f2a}.empty,.loading,.error{text-align:center;padding:60px;color:var(--muted)}.error{color:var(--red)}.footer{display:flex;justify-content:space-between;gap:14px;color:var(--muted);font-size:13px;margin-top:13px}.table tbody tr{cursor:pointer}
    dialog{width:min(760px,calc(100% - 32px));border:0;border-radius:16px;padding:0;box-shadow:0 24px 80px rgba(10,25,50,.3)}dialog::backdrop{background:rgba(12,23,42,.55)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:19px}.close{border:0;background:transparent;font-size:24px}.details{display:grid;grid-template-columns:140px 1fr;margin:0;padding:18px 22px}.details dt,.details dd{margin:0;padding:8px 0;border-bottom:1px solid #edf1f6;word-break:break-word}.details dt{color:var(--muted);font-weight:650}
    @media(max-width:850px){.shell{padding:16px}.top{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:repeat(2,1fr)}.actions{width:100%}.actions select{flex:1}.panel-title{align-items:flex-start;flex-direction:column}.footer{flex-direction:column}}
  </style>
</head>
<body><main class="shell">
  <header class="top"><div><h1>Exchange Edge 邮件监控台</h1><div class="sub" id="subtitle">正在读取 Edge 传输日志…</div></div><div class="actions"><select id="days"><option value="1">最近1天</option><option value="7">最近7天</option><option value="30">最近30天</option></select><button class="primary" id="refresh">刷新</button></div></header>
  <section class="cards"><div class="card metric"><label>收件</label><strong class="blue" id="inbound">—</strong></div><div class="card metric"><label>发件</label><strong class="green" id="outbound">—</strong></div><div class="card metric"><label>拒收</label><strong class="red" id="rejected">—</strong></div><div class="card metric"><label>公司外发失败</label><strong class="orange" id="failed">—</strong></div><div class="card metric"><label>匿名冒充公司域</label><strong class="red" id="spoofed">—</strong></div></section>
  <section class="panel"><div class="panel-title"><h2 id="chartTitle">最近24小时邮件趋势</h2><div class="legend"><span><i class="dot" style="background:var(--blue)"></i>收件</span><span><i class="dot" style="background:var(--green)"></i>发件</span><span><i class="dot" style="background:var(--red)"></i>拒收</span><span><i class="dot" style="background:#9b2fd0"></i>冒充</span></div></div><svg id="chart" role="img" aria-label="邮件收发、拒收和冒充数量"></svg></section>
  <section class="panel"><div class="panel-title toolbar"><input class="search" id="search" placeholder="搜索发件人、收件人、IP、主题或原因"><button id="export">导出 CSV</button><span class="meta" id="summary"></span></div>
    <nav class="tabs" id="tabs"></nav><div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>类型</th><th>发件人</th><th>收件人</th><th>远端 IP</th><th>分类</th><th>主题</th><th>状态</th><th>原因</th><th>来源</th></tr></thead><tbody id="rows"></tbody></table><div id="state" class="loading">正在加载…</div></div>
  </section><footer class="footer"><span id="updated"></span><span id="files"></span></footer>
</main><dialog id="detail"><div class="modal-head"><h2>邮件事件详情</h2><button class="close" id="closeDetail" aria-label="关闭">×</button></div><dl class="details" id="detailBody"></dl></dialog><script>
const tabs=[['all','全部'],['收件','收件'],['发件','发件'],['拒收','拒收'],['spoofed','匿名冒充公司域'],['外发失败','外发失败'],['system','系统退信'],['anomaly','异常发件人']];let data=null,active='all';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function matchType(t){return active==='all'||t===active||(active==='system'&&t.startsWith('系统退信'))||(active==='anomaly'&&t.startsWith('异常发件人'))||(active==='spoofed'&&t.startsWith('匿名冒充公司域'))}
function renderTabs(){const nav=document.querySelector('#tabs');nav.innerHTML='';tabs.forEach(([key,label])=>{let b=document.createElement('button');b.className='tab'+(key===active?' active':'');b.textContent=label;b.onclick=()=>{active=key;renderTabs();renderRows()};nav.appendChild(b)})}
function filtered(){const q=document.querySelector('#search').value.toLowerCase();return data?data.items.filter(x=>matchType(x.type)&&Object.values(x).join(' ').toLowerCase().includes(q)):[]}
function renderRows(){if(!data)return;const list=filtered();document.querySelector('#rows').innerHTML=list.slice(0,2000).map((x,i)=>`<tr data-index="${data.items.indexOf(x)}" title="点击查看完整详情"><td>${new Date(x.time).toLocaleString()}</td><td><span class="pill ${x.type.startsWith('匿名冒充')?'danger':''}">${esc(x.type)}</span></td><td>${esc(x.sender)}</td><td>${esc(x.recipients)}</td><td>${esc(x.remoteIp)}</td><td>${esc(x.category)}</td><td>${esc(x.subject)}</td><td>${esc(x.status)}</td><td>${esc(x.reason)}</td><td>${esc(x.source)}</td></tr>`).join('');document.querySelectorAll('#rows tr').forEach(row=>row.onclick=()=>showDetail(data.items[Number(row.dataset.index)]));let s=document.querySelector('#state');s.className=list.length?'':'empty';s.textContent=list.length?'': '没有符合条件的记录';document.querySelector('#summary').textContent=`${list.length} 条记录`}
function showDetail(x){const labels={time:'时间',type:'类型',sender:'发件人',recipients:'收件人',remoteIp:'远端 IP',category:'分类',subject:'主题',status:'状态',reason:'原因',connector:'连接器/代理',source:'日志来源'};document.querySelector('#detailBody').innerHTML=Object.entries(labels).map(([k,v])=>`<dt>${v}</dt><dd>${esc(k==='time'?new Date(x[k]).toLocaleString():x[k])||'—'}</dd>`).join('');document.querySelector('#detail').showModal()}
function draw(){const svg=document.querySelector('#chart'),w=svg.clientWidth||900,h=210,p=28,series=data.days===1?data.hourly:data.daily;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);let max=Math.max(1,...series.map(d=>d.inbound+d.outbound+d.rejected+d.spoofed)),slot=(w-p*2)/series.length,bw=Math.max(3,slot*.58),out='';series.forEach((d,i)=>{let x=p+i*slot+(slot-bw)/2,y=h-28;[['inbound','#1f63e9'],['outbound','#14965a'],['rejected','#df3c36'],['spoofed','#9b2fd0']].forEach(([k,c])=>{let bh=(h-55)*(d[k]||0)/max;y-=bh;out+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="${c}" rx="2"><title>${d.label||d.date} ${k}: ${d[k]||0}</title></rect>`});if((data.days===1&&i%3===0)||data.days===7||i%5===0||i===series.length-1)out+=`<text class="bar-label" text-anchor="middle" x="${x+bw/2}" y="${h-8}">${data.days===1?d.label:d.date.slice(5)}</text>`});svg.innerHTML=out}
async function load(){document.querySelector('#state').className='loading';document.querySelector('#state').textContent='正在加载…';try{const selectedDays=document.querySelector('#days').value;let r=await fetch(`/api/dashboard?days=${selectedDays}`,{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||r.statusText);data=j;document.querySelector('#chartTitle').textContent=selectedDays==='1'?'最近24小时邮件趋势':'每日邮件趋势';for(let k of ['inbound','outbound','rejected','failed','spoofed'])document.querySelector('#'+k).textContent=j.counts[k];document.querySelector('#subtitle').textContent=`${j.config.domain} · 可信 Mail ${j.config.trustedIp} · 日志只读分析`;const sync=j.sync.lastSuccess?new Date(j.sync.lastSuccess).toLocaleString():'本地挂载';const newest=j.sync.newestRecord?new Date(j.sync.newestRecord).toLocaleString():'无记录';document.querySelector('#updated').textContent=`更新：${new Date(j.generatedAt).toLocaleString()} · SFTP：${sync} · 最新日志：${newest}`;document.querySelector('#files').textContent=`关联邮件 ${j.trustedMessages} · Tracking ${j.files.tracking} / Agent ${j.files.agent} / SMTP ${j.files.protocol}`;draw();renderRows()}catch(e){document.querySelector('#state').className='error';document.querySelector('#state').textContent=e.message}}
function exportCsv(){const cols=[['time','时间'],['type','类型'],['sender','发件人'],['recipients','收件人'],['remoteIp','远端IP'],['category','分类'],['subject','主题'],['status','状态'],['reason','原因'],['connector','连接器/代理'],['source','来源']],quote=v=>'"'+String(v??'').replaceAll('"','""')+'"',rows=[cols.map(x=>quote(x[1])).join(','),...filtered().map(x=>cols.map(([k])=>quote(k==='time'?new Date(x[k]).toLocaleString():x[k])).join(','))];const blob=new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`exchange-edge-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href)}
document.querySelector('#tabs').innerHTML='';renderTabs();document.querySelector('#refresh').onclick=load;document.querySelector('#days').onchange=load;document.querySelector('#search').oninput=renderRows;document.querySelector('#export').onclick=exportCsv;document.querySelector('#closeDetail').onclick=()=>document.querySelector('#detail').close();addEventListener('resize',()=>data&&draw());load();setInterval(load,60000);
</script></body></html>
