<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Exchange Edge 邮件监控台</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f63e9'/%3E%3Cpath d='M13 19h38v27H13z' fill='white'/%3E%3Cpath d='m14 21 18 15 18-15' fill='none' stroke='%231f63e9' stroke-width='5'/%3E%3C/svg%3E">
  <style>
    :root{--blue:#1f63e9;--green:#14965a;--red:#df3c36;--orange:#f27618;--ink:#142033;--muted:#6d7d94;--line:#e6ebf3;--bg:#f4f7fb;--card:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
    button,select,input{font:inherit}.shell{max-width:1560px;margin:auto;padding:28px}.top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}
    h1{margin:0;font-size:30px;letter-spacing:-.5px}.sub{color:var(--muted);margin-top:4px}.actions{display:flex;gap:10px;align-items:center}
    select,button,input{height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 14px}button{cursor:pointer;font-weight:650}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
    .cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 7px 28px rgba(24,43,78,.05)}
    .metric{padding:18px 20px}.metric label{display:block;color:var(--muted);font-weight:650}.en{display:block;color:#9aa6b7;font-size:10px;font-weight:500;letter-spacing:.02em}.metric strong{font-size:34px;line-height:1.2}.blue{color:var(--blue)}.green{color:var(--green)}.red{color:var(--red)}.orange{color:var(--orange)}
    .panel{margin-top:14px;padding:18px}.panel-title{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:14px}.panel-title h2{font-size:17px;margin:0}.legend{display:flex;gap:15px;color:var(--muted);font-size:13px}.dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}
    #chart{width:100%;height:210px;display:block}.bar-label{font-size:11px;fill:#728198}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.search{min-width:250px;flex:1}.meta{color:var(--muted);font-size:13px}
    .tabs{display:flex;gap:5px;overflow:auto;border-bottom:1px solid var(--line);margin:0 -18px;padding:0 18px}.tab{height:43px;border:0;border-radius:0;background:transparent;padding:0 13px;color:#5b6b82;white-space:nowrap}.tab.active{color:var(--blue);border-bottom:3px solid var(--blue)}
    .table-wrap{overflow:auto;max-height:480px;margin:0 -18px -18px}.table{width:100%;border-collapse:collapse;min-width:1120px}.table th{position:sticky;top:0;background:#f7f9fc;color:#596a81;text-align:left;font-size:13px;padding:8px 12px;border-bottom:1px solid var(--line)}.table td{padding:9px 12px;border-bottom:1px solid #edf1f6;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.table tr:hover td{background:#f8fbff}.verdict{font-weight:650}.ok{color:var(--green)}.warn{color:var(--orange)}.bad{color:var(--red)}
    .pill{font-size:12px;padding:3px 8px;border-radius:999px;background:#edf3ff;color:#245fca}.pill.danger{background:#fff0ef;color:#c72f2a}.empty,.loading,.error{text-align:center;padding:60px;color:var(--muted)}.error{color:var(--red)}.footer{display:flex;justify-content:space-between;gap:14px;color:var(--muted);font-size:13px;margin-top:13px}.table tbody tr{cursor:pointer}
    dialog{width:min(760px,calc(100% - 32px));border:0;border-radius:16px;padding:0;box-shadow:0 24px 80px rgba(10,25,50,.3)}dialog::backdrop{background:rgba(12,23,42,.55)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:19px}.close{border:0;background:transparent;font-size:24px}.details{display:grid;grid-template-columns:140px 1fr;margin:0;padding:18px 22px}.details dt,.details dd{margin:0;padding:8px 0;border-bottom:1px solid #edf1f6;word-break:break-word}.details dt{color:var(--muted);font-weight:650}
    @media(max-width:850px){.shell{padding:16px}.top{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:repeat(2,1fr)}.actions{width:100%}.actions select{flex:1}.panel-title{align-items:flex-start;flex-direction:column}.footer{flex-direction:column}}
  </style>
</head>
<body><main class="shell">
  <header class="top"><div><h1>Exchange Edge 邮件监控台</h1><div class="sub" id="subtitle">正在读取 Edge 传输日志…</div></div><div class="actions"><select id="days"><option value="1">最近1天</option><option value="7">最近7天</option><option value="30">最近30天</option></select><button class="primary" id="refresh">刷新</button></div></header>
  <section class="cards"><div class="card metric"><label>收件<span class="en">Inbound</span></label><strong class="blue" id="inbound">—</strong></div><div class="card metric"><label>发件<span class="en">Outbound</span></label><strong class="green" id="outbound">—</strong></div><div class="card metric"><label>拒收<span class="en">Rejected</span></label><strong class="red" id="rejected">—</strong></div><div class="card metric"><label>公司外发失败<span class="en">Outbound failed</span></label><strong class="orange" id="failed">—</strong></div><div class="card metric"><label>匿名冒充公司域<span class="en">Domain spoofing</span></label><strong class="red" id="spoofed">—</strong></div></section>
  <section class="panel"><div class="panel-title"><h2 id="chartTitle">最近24小时邮件趋势</h2><div class="legend"><span><i class="dot" style="background:var(--blue)"></i>收件</span><span><i class="dot" style="background:var(--green)"></i>发件</span><span><i class="dot" style="background:var(--red)"></i>拒收</span><span><i class="dot" style="background:#9b2fd0"></i>冒充</span></div></div><svg id="chart" role="img" aria-label="邮件收发、拒收和冒充数量"></svg></section>
  <section class="panel"><div class="panel-title toolbar"><input class="search" id="search" placeholder="搜索发件人、收件人、IP、主题或原因"><select id="node"><option value="all">全部 MX 节点</option></select><button id="export">导出 CSV</button><span class="meta" id="summary"></span></div>
    <nav class="tabs" id="tabs"></nav><div class="table-wrap"><table class="table"><thead><tr><th>时间<span class="en">Time</span></th><th>MX 节点<span class="en">MX node</span></th><th>类型<span class="en">Type</span></th><th>发件人<span class="en">Sender</span></th><th>收件人<span class="en">Recipient</span></th><th>远端 IP<span class="en">Remote IP</span></th><th>发生了什么<span class="en">Summary</span></th><th>处理结果<span class="en">Result</span></th><th>主题<span class="en">Subject</span></th></tr></thead><tbody id="rows"></tbody></table><div id="state" class="loading">正在加载…</div></div>
  </section><footer class="footer"><span id="updated"></span><span id="files"></span></footer>
</main><dialog id="detail"><div class="modal-head"><h2>邮件事件详情 <span class="en">Mail event details</span></h2><button class="close" id="closeDetail" aria-label="关闭">×</button></div><dl class="details" id="detailBody"></dl></dialog><script>
const tabs=[['all','全部日志'],['收件','收件'],['发件','发件'],['拒收','拒收'],['spoofed','匿名冒充公司域'],['外发失败','外发失败'],['system','系统退信'],['anomaly','异常发件人']];let data=null,rawData={items:[],page:1,pageSize:500,total:0,parseErrors:0},displayed=[],active='all',currentRequest=null,loadSerial=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatDate=value=>{const date=new Date(value);return Number.isNaN(date.getTime())?'时间格式异常':date.toLocaleString()};
function matchType(t){return active==='all'||t===active||(active==='system'&&t.startsWith('系统退信'))||(active==='anomaly'&&t.startsWith('异常发件人'))||(active==='spoofed'&&t.startsWith('匿名冒充公司域'))}
function renderTabs(){const nav=document.querySelector('#tabs');nav.innerHTML='';tabs.forEach(([key,label])=>{let b=document.createElement('button');b.className='tab'+(key===active?' active':'');b.textContent=label;b.onclick=()=>{active=key;renderTabs();active==='all'?loadRaw(1):renderRows()};nav.appendChild(b)})}
function filtered(){const q=document.querySelector('#search').value.toLowerCase(),node=document.querySelector('#node').value,source=active==='all'?rawData.items:(data?data.items:[]);return source.filter(x=>(active==='all'||matchType(x.type))&&(node==='all'||x.node.split(',').map(v=>v.trim()).includes(node))&&Object.values(x).join(' ').toLowerCase().includes(q))}
function resultOf(x){if(x.type==='收件')return['已接收','ok'];if(x.type==='发件'||x.type==='系统退信')return['已发送','ok'];if(x.type.includes('失败'))return['发送失败','bad'];if(x.type==='拒收'||x.type.includes('已拒收'))return['已拒绝','bad'];if(x.type.startsWith('匿名冒充'))return['已接收，建议检查','warn'];if(x.type.startsWith('异常发件人'))return['已发送，建议检查','warn'];return['需要检查','warn']}
function summaryOf(x){return x.category||({收件:'正常外部来信',发件:'可信 Mail 正常外发',拒收:'邮件被 Edge 拒绝'}[x.type]||x.type)}
function renderRows(){if(!data)return;const list=filtered();displayed=list.slice(0,2000);document.querySelector('#rows').innerHTML=displayed.map((x,i)=>{const result=resultOf(x);return `<tr data-index="${i}" title="点击查看中英文完整详情"><td>${x.time&&x.time.startsWith('1970-')?'无法解析':formatDate(x.time)}</td><td>${esc(x.node)||'—'}</td><td><span class="pill ${x.type.startsWith('匿名冒充')?'danger':''}">${esc(x.type)}</span></td><td>${esc(x.sender)||'—'}</td><td>${esc(x.recipients)||'—'}</td><td>${esc(x.remoteIp)||'—'}</td><td>${esc(summaryOf(x))}</td><td class="verdict ${result[1]}">${result[0]}</td><td>${esc(x.subject)||'—'}</td></tr>`}).join('');document.querySelectorAll('#rows tr').forEach(row=>row.onclick=()=>showDetail(displayed[Number(row.dataset.index)]));let s=document.querySelector('#state');s.className=list.length?'':'empty';s.textContent=list.length?'': '没有符合条件的记录';if(active==='all'){const pages=Math.max(1,Math.ceil(rawData.total/rawData.pageSize));document.querySelector('#summary').innerHTML=`第 ${rawData.page}/${pages} 页 · 共 ${rawData.total} 行 · 解析异常 ${rawData.parseErrors} 行 <button id="prevPage" ${rawData.page<=1?'disabled':''}>上一页</button> <button id="nextPage" ${rawData.page>=pages?'disabled':''}>下一页</button>`;document.querySelector('#prevPage').onclick=()=>loadRaw(rawData.page-1);document.querySelector('#nextPage').onclick=()=>loadRaw(rawData.page+1)}else document.querySelector('#summary').textContent=`${list.length} 条邮件事件`}
function showDetail(x){const result=resultOf(x),values={summary:summaryOf(x),result:result[0],time:x.time&&x.time.startsWith('1970-')?'无法解析':formatDate(x.time),node:x.node,type:x.type,sender:x.sender,recipients:x.recipients,remoteIp:x.remoteIp,subject:x.subject,status:x.status,reason:x.reason,connector:x.connector,source:x.source,rawData:x.rawData?JSON.stringify(x.rawData,null,2):''},labels={summary:'中文结论 / Summary',result:'处理结果 / Result',time:'时间 / Time',node:'MX 节点 / MX node',type:'类型 / Type',sender:'发件人 / Sender',recipients:'收件人 / Recipient',remoteIp:'远端 IP / Remote IP',subject:'主题 / Subject',status:'原始状态 / Raw status',reason:'原始错误 / Raw error',connector:'连接器或代理 / Connector or agent',source:'日志来源 / Log source',rawData:'完整原始字段 / Raw fields'};document.querySelector('#detailBody').innerHTML=Object.entries(labels).filter(([k])=>values[k]).map(([k,v])=>`<dt>${v}</dt><dd>${esc(values[k])||'—'}</dd>`).join('');document.querySelector('#detail').showModal()}
function draw(){const svg=document.querySelector('#chart'),w=svg.clientWidth||900,h=210,p=28,series=data.days===1?data.hourly:data.daily;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);let max=Math.max(1,...series.map(d=>d.inbound+d.outbound+d.rejected+d.spoofed)),slot=(w-p*2)/series.length,bw=Math.max(3,slot*.58),out='';series.forEach((d,i)=>{let x=p+i*slot+(slot-bw)/2,y=h-28;[['inbound','#1f63e9'],['outbound','#14965a'],['rejected','#df3c36'],['spoofed','#9b2fd0']].forEach(([k,c])=>{let bh=(h-55)*(d[k]||0)/max;y-=bh;out+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="${c}" rx="2"><title>${d.label||d.date} ${k}: ${d[k]||0}</title></rect>`});if((data.days===1&&i%3===0)||data.days===7||i%5===0||i===series.length-1)out+=`<text class="bar-label" text-anchor="middle" x="${x+bw/2}" y="${h-8}">${data.days===1?d.label:d.date.slice(5)}</text>`});svg.innerHTML=out}
async function loadRaw(page=1){const days=document.querySelector('#days').value,r=await fetch(`/api/logs?days=${encodeURIComponent(days)}&page=${page}&pageSize=500`,{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||r.statusText);rawData=j;renderRows()}
async function load(){const serial=++loadSerial;if(currentRequest)currentRequest.abort();const controller=new AbortController();currentRequest=controller;document.querySelector('#state').className='loading';document.querySelector('#state').textContent='正在读取后台分析结果，请稍候…';try{const selectedDays=document.querySelector('#days').value,r=await fetch(`/api/dashboard?days=${encodeURIComponent(selectedDays)}`,{cache:'no-store',signal:controller.signal}),j=await r.json();if(!r.ok)throw Error(j.error||r.statusText);if(serial!==loadSerial)return;data=j;document.querySelector('#chartTitle').textContent=selectedDays==='1'?'最近24小时邮件趋势':'每日邮件趋势';for(let k of ['inbound','outbound','rejected','failed','spoofed'])document.querySelector('#'+k).textContent=j.counts[k];document.querySelector('#subtitle').textContent=`${j.config.domain} · MX ${j.config.nodes.join(', ')} · 可信 Mail ${j.config.trustedIps.join(', ')} · 日志只读分析`;const picker=document.querySelector('#node'),selected=picker.value;picker.innerHTML='<option value="all">全部 MX 节点</option>'+j.config.nodes.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');picker.value=j.config.nodes.includes(selected)?selected:'all';const sync=j.sync.lastSuccess?formatDate(j.sync.lastSuccess):'本地挂载',newest=j.sync.newestRecord?formatDate(j.sync.newestRecord):'无记录',online=j.sync.nodes.filter(n=>n.online).length,indexState=j.index||{},indexText=indexState.running?'索引处理中':(indexState.lastError?'索引异常':`已索引 ${indexState.files||0} 个文件`);document.querySelector('#updated').textContent=`更新：${formatDate(j.generatedAt)} · MX 在线 ${online}/${j.sync.nodes.length} · ${indexText} · SFTP：${sync} · 最新日志：${newest}`;document.querySelector('#files').textContent=`关联邮件 ${j.trustedMessages} · Tracking ${j.files.tracking} / Agent ${j.files.agent} / SMTP ${j.files.protocol}`;draw();if(active==='all')await loadRaw(1);else renderRows()}catch(e){if(e.name==='AbortError'||serial!==loadSerial)return;document.querySelector('#state').className='error';document.querySelector('#state').textContent=/expected pattern/i.test(e.message)?'浏览器请求格式异常，请刷新页面后重试。':`加载失败：${e.message}`}finally{if(serial===loadSerial)currentRequest=null}}
function exportCsv(){const cols=[['time','时间'],['type','类型'],['sender','发件人'],['recipients','收件人'],['remoteIp','远端IP'],['category','分类'],['subject','主题'],['status','状态'],['reason','原因'],['connector','连接器/代理'],['source','来源']],quote=v=>'"'+String(v??'').replaceAll('"','""')+'"',rows=[cols.map(x=>quote(x[1])).join(','),...filtered().map(x=>cols.map(([k])=>quote(k==='time'?new Date(x[k]).toLocaleString():x[k])).join(','))];const blob=new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`exchange-edge-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href)}
document.querySelector('#tabs').innerHTML='';renderTabs();document.querySelector('#refresh').onclick=load;document.querySelector('#days').onchange=load;document.querySelector('#node').onchange=renderRows;document.querySelector('#search').oninput=renderRows;document.querySelector('#export').onclick=exportCsv;document.querySelector('#closeDetail').onclick=()=>document.querySelector('#detail').close();addEventListener('resize',()=>data&&draw());load();setInterval(()=>{if(!document.hidden&&!currentRequest)load()},60000);
</script></body></html>
