<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Exchange Edge 邮件监控台</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f63e9'/%3E%3Cpath d='M13 19h38v27H13z' fill='white'/%3E%3Cpath d='m14 21 18 15 18-15' fill='none' stroke='%231f63e9' stroke-width='5'/%3E%3C/svg%3E">
  <style>
    :root{--blue:#1f63e9;--green:#14965a;--red:#df3c36;--orange:#f27618;--ink:#142033;--muted:#6d7d94;--line:#e6ebf3;--bg:#f4f7fb;--card:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
    button,select,input{font:inherit}.shell{max-width:1560px;margin:auto;padding:28px}.top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}
    h1{margin:0;font-size:30px;letter-spacing:-.5px}.sub{color:var(--muted);margin-top:4px}.actions{display:flex;gap:10px;align-items:center}
    select,button,input{height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 14px}button{cursor:pointer;font-weight:650}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
    .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 7px 28px rgba(24,43,78,.05)}
    .metric{padding:18px 20px}.metric label{display:block;color:var(--muted);font-weight:650}.metric strong{font-size:34px;line-height:1.2}.blue{color:var(--blue)}.green{color:var(--green)}.red{color:var(--red)}.orange{color:var(--orange)}
    .panel{margin-top:14px;padding:18px}.panel-title{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:14px}.panel-title h2{font-size:17px;margin:0}.legend{display:flex;gap:15px;color:var(--muted);font-size:13px}.dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}
    #chart{width:100%;height:210px;display:block}.bar-label{font-size:11px;fill:#728198}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.search{min-width:250px;flex:1}.meta{color:var(--muted);font-size:13px}
    .tabs{display:flex;gap:5px;overflow:auto;border-bottom:1px solid var(--line);margin:0 -18px;padding:0 18px}.tab{height:43px;border:0;border-radius:0;background:transparent;padding:0 13px;color:#5b6b82;white-space:nowrap}.tab.active{color:var(--blue);border-bottom:3px solid var(--blue)}
    .table-wrap{overflow:auto;max-height:480px;margin:0 -18px -18px}.table{width:100%;border-collapse:collapse;min-width:1250px}.table th{position:sticky;top:0;background:#f7f9fc;color:#596a81;text-align:left;font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line)}.table td{padding:9px 12px;border-bottom:1px solid #edf1f6;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.table tr:hover td{background:#f8fbff}
    .pill{font-size:12px;padding:3px 8px;border-radius:999px;background:#edf3ff;color:#245fca}.empty,.loading,.error{text-align:center;padding:60px;color:var(--muted)}.error{color:var(--red)}.footer{display:flex;justify-content:space-between;gap:14px;color:var(--muted);font-size:13px;margin-top:13px}
    @media(max-width:850px){.shell{padding:16px}.top{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:repeat(2,1fr)}.actions{width:100%}.actions select{flex:1}.panel-title{align-items:flex-start;flex-direction:column}.footer{flex-direction:column}}
  </style>
</head>
<body><main class="shell">
  <header class="top"><div><h1>Exchange Edge 邮件监控台</h1><div class="sub" id="subtitle">正在读取 Edge 传输日志…</div></div><div class="actions"><select id="days"><option value="1">最近1天</option><option value="7">最近7天</option><option value="30">最近30天</option></select><button class="primary" id="refresh">刷新</button></div></header>
  <section class="cards"><div class="card metric"><label>收件</label><strong class="blue" id="inbound">—</strong></div><div class="card metric"><label>发件</label><strong class="green" id="outbound">—</strong></div><div class="card metric"><label>拒收</label><strong class="red" id="rejected">—</strong></div><div class="card metric"><label>公司外发失败</label><strong class="orange" id="failed">—</strong></div></section>
  <section class="panel"><div class="panel-title"><h2 id="chartTitle">最近24小时邮件构成</h2><div class="legend"><span><i class="dot" style="background:var(--blue)"></i>收件</span><span><i class="dot" style="background:var(--green)"></i>发件</span><span><i class="dot" style="background:var(--red)"></i>拒收</span></div></div><svg id="chart" role="img" aria-label="邮件收发和拒收数量"></svg></section>
  <section class="panel"><div class="panel-title toolbar"><input class="search" id="search" placeholder="搜索发件人、收件人、IP、主题或原因"><span class="meta" id="summary"></span></div>
    <nav class="tabs" id="tabs"></nav><div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>类型</th><th>发件人</th><th>收件人</th><th>远端 IP</th><th>主题</th><th>状态</th><th>原因</th><th>来源</th></tr></thead><tbody id="rows"></tbody></table><div id="state" class="loading">正在加载…</div></div>
  </section><footer class="footer"><span id="updated"></span><span id="files"></span></footer>
</main><script>
const tabs=[['all','全部'],['收件','收件'],['发件','发件'],['拒收','拒收'],['外发失败','外发失败'],['system','系统退信'],['anomaly','异常发件人']];let data=null,active='all';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function matchType(t){return active==='all'||t===active||(active==='system'&&t.startsWith('系统退信'))||(active==='anomaly'&&t.startsWith('异常发件人'))}
function renderTabs(){const nav=document.querySelector('#tabs');nav.innerHTML='';tabs.forEach(([key,label])=>{let b=document.createElement('button');b.className='tab'+(key===active?' active':'');b.textContent=label;b.onclick=()=>{active=key;renderTabs();renderRows()};nav.appendChild(b)})}
function renderRows(){if(!data)return;const q=document.querySelector('#search').value.toLowerCase();const list=data.items.filter(x=>matchType(x.type)&&Object.values(x).join(' ').toLowerCase().includes(q));document.querySelector('#rows').innerHTML=list.slice(0,2000).map(x=>`<tr title="${esc(x.reason)}"><td>${new Date(x.time).toLocaleString()}</td><td><span class="pill">${esc(x.type)}</span></td><td>${esc(x.sender)}</td><td>${esc(x.recipients)}</td><td>${esc(x.remoteIp)}</td><td>${esc(x.subject)}</td><td>${esc(x.status)}</td><td>${esc(x.reason)}</td><td>${esc(x.source)}</td></tr>`).join('');let s=document.querySelector('#state');s.className=list.length?'':'empty';s.textContent=list.length?'': '没有符合条件的记录';document.querySelector('#summary').textContent=`${list.length} 条记录`}
function draw(){const svg=document.querySelector('#chart'),w=svg.clientWidth||900,h=210,p=28;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);if(data.daily.length===1){const d=data.daily[0],parts=[['收件',data.counts.inbound,'#1f63e9'],['发件',data.counts.outbound,'#14965a'],['拒收',data.counts.rejected,'#df3c36']],total=parts.reduce((s,x)=>s+x[1],0),denominator=Math.max(1,total),r=68,c=2*Math.PI*r,cx=Math.min(w*.36,300),cy=h/2,sw=22;let offset=0,out=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#edf1f7" stroke-width="${sw}"/>`;parts.forEach(([label,value,color])=>{if(!value)return;const len=c*value/denominator;out+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"><title>${label}: ${value}</title></circle>`;offset+=len});out+=`<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="30" font-weight="750" fill="#142033">${total}</text><text x="${cx}" y="${cy+20}" text-anchor="middle" font-size="12" fill="#728198">封邮件</text>`;parts.forEach(([label,value,color],i)=>{const x=Math.max(cx+125,w*.56),y=65+i*40;out+=`<rect x="${x}" y="${y-11}" width="11" height="11" rx="3" fill="${color}"/><text x="${x+20}" y="${y}" font-size="14" fill="#596a81">${label}</text><text x="${x+100}" y="${y}" font-size="18" font-weight="700" fill="#142033">${value}</text>`});svg.innerHTML=out;return}let max=Math.max(1,...data.daily.map(d=>d.inbound+d.outbound+d.rejected)),slot=(w-p*2)/data.daily.length,bw=Math.max(3,slot*.55),out='';data.daily.forEach((d,i)=>{let x=p+i*slot+(slot-bw)/2,y=h-28;[['inbound','#1f63e9'],['outbound','#14965a'],['rejected','#df3c36']].forEach(([k,c])=>{let bh=(h-55)*d[k]/max;y-=bh;out+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="${c}" rx="2"><title>${d.date} ${k}: ${d[k]}</title></rect>`});if(data.daily.length<=10||i%5===0||i===data.daily.length-1)out+=`<text class="bar-label" text-anchor="middle" x="${x+bw/2}" y="${h-8}">${d.date.slice(5)}</text>`});svg.innerHTML=out}
async function load(){document.querySelector('#state').className='loading';document.querySelector('#state').textContent='正在加载…';try{const selectedDays=document.querySelector('#days').value;let r=await fetch(`/api/dashboard?days=${selectedDays}`,{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||r.statusText);data=j;document.querySelector('#chartTitle').textContent=selectedDays==='1'?'最近24小时邮件构成':'每日邮件趋势';for(let k of ['inbound','outbound','rejected','failed'])document.querySelector('#'+k).textContent=j.counts[k];document.querySelector('#subtitle').textContent=`${j.config.domain} · 可信 Mail ${j.config.trustedIp} · 日志只读分析`;document.querySelector('#updated').textContent=`更新：${new Date(j.generatedAt).toLocaleString()} · 系统退信 ${j.counts.systemNdr} · 异常发件人 ${j.counts.anomaly}`;document.querySelector('#files').textContent=`关联邮件 ${j.trustedMessages} · Tracking ${j.files.tracking} / Agent ${j.files.agent} / SMTP ${j.files.protocol}`;draw();renderRows()}catch(e){document.querySelector('#state').className='error';document.querySelector('#state').textContent=e.message}}
document.querySelector('#tabs').innerHTML='';renderTabs();document.querySelector('#refresh').onclick=load;document.querySelector('#days').onchange=load;document.querySelector('#search').oninput=renderRows;addEventListener('resize',()=>data&&draw());load();setInterval(load,60000);
</script></body></html>
